---
- name: Crear directorio para el almacenamiento de DataNode
  ansible.builtin.file:
    path: /var/hadoop/hdfs/datanode
    state: directory
    mode: '0777'

- name: Desplegar contenedor HDFS DataNode
  community.docker.docker_container:
    name: datanode
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    state: started
    restart_policy: always
    network_mode: host
    volumes:
      - /var/hadoop/hdfs/datanode:/hadoop/dfs/data
    env:
      SERVICE_PRECONDITION: "master:9870"
      CORE_CONF_fs_defaultFS: "hdfs://master:9000"
      HDFS_CONF_dfs_replication: "2"
      HDFS_CONF_dfs_permissions: "false"

- name: Desplegar contenedor Spark Worker
  community.docker.docker_container:
    name: spark-worker
    image: bde2020/spark-worker:3.0.0-hadoop3.2
    state: started
    restart_policy: always
    network_mode: host
    env:
      SPARK_MASTER: "spark://master:7077"
      SPARK_LOCAL_IP: "{{ hostvars[inventory_hostname]['node_ip'] }}"
      SPARK_WORKER_WEBUI_PORT: "8081"
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: "1G"
      CORE_CONF_fs_defaultFS: "hdfs://master:9000"
      PYSPARK_PYTHON: "python3"
      PYSPARK_DRIVER_PYTHON: "python3"
