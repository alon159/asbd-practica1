---
- name: Crear directorio para el almacenamiento de NameNode
  ansible.builtin.file:
    path: /var/hadoop/hdfs/namenode
    state: directory
    mode: '0777'

- name: Desplegar contenedor HDFS NameNode
  community.docker.docker_container:
    name: namenode
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    state: started
    restart_policy: always
    network_mode: host
    volumes:
      - /var/hadoop/hdfs/namenode:/hadoop/dfs/name
      - /vagrant/data:/data
    env:
      CLUSTER_NAME: "asbd-cluster"
      CORE_CONF_fs_defaultFS: "hdfs://master:9000"
      HDFS_CONF_dfs_replication: "2"
      HDFS_CONF_dfs_permissions: "false"
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"

- name: Desplegar contenedor Spark Master
  community.docker.docker_container:
    name: spark-master
    image: bde2020/spark-master:3.0.0-hadoop3.2
    state: started
    restart_policy: always
    network_mode: host
    volumes:
      - /vagrant/jobs:/jobs
    env:
      INIT_DAEMON_STEP: "setup_spark"
      CORE_CONF_fs_defaultFS: "hdfs://master:9000"
      SPARK_MASTER_HOST: "master"
      SPARK_LOCAL_IP: "192.168.56.10"
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      PYSPARK_PYTHON: "python3"
      PYSPARK_DRIVER_PYTHON: "python3"
