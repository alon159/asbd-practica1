---
- name: 1. Instalar Docker y preparar entorno en todos los nodos
  hosts: bigdata
  become: true
  gather_facts: true

  tasks:
    - name: Configurar resolución de nombres cruzada en /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
        state: present
      loop:
        - "192.168.56.10 master"
        - "192.168.56.11 worker1"
        - "192.168.56.12 worker2"

    - name: Comprobar si existe archivo swap
      ansible.builtin.stat:
        path: /swapfile
      register: swap_stat

    - name: Crear archivo de swap de 1GB si no existe
      ansible.builtin.command:
        cmd: fallocate -l 1G /swapfile
      when: not swap_stat.stat.exists

    - name: Asignar permisos al archivo swap
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'
      when: not swap_stat.stat.exists

    - name: Formatear swapfile
      ansible.builtin.command:
        cmd: mkswap /swapfile
      when: not swap_stat.stat.exists

    - name: Activar swap
      ansible.builtin.command:
        cmd: swapon /swapfile
      when: not swap_stat.stat.exists

    - name: Persistir swap en /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: '/swapfile none swap sw 0 0'
        state: present

    - name: Actualizar caché de apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600


    - name: Instalar dependencias del sistema y Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-pip
          - docker.io
          - docker-compose-v2
        state: present

    - name: Asegurar que el servicio Docker está iniciado y habilitado
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Agregar usuario vagrant al grupo docker
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: true

    - name: Comprobar que Docker responde correctamente
      ansible.builtin.command:
        cmd: docker version --format '{{.Server.Version}}'
      register: docker_ver
      changed_when: false

    - name: Comprobar versión de Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_ver
      changed_when: false

    - name: Mostrar versiones detectadas
      ansible.builtin.debug:
        msg: "Docker Server: {{ docker_ver.stdout }} | Compose: {{ compose_ver.stdout }}"

- name: 2. Desplegar servicios Master (HDFS NameNode y Spark Master)
  hosts: bigdata_master
  become: true
  roles:
    - role: master

- name: 3. Desplegar servicios Workers (HDFS DataNodes y Spark Workers)
  hosts: bigdata_workers
  become: true
  roles:
    - role: worker

- name: 4. Verificación de estado del clúster Big Data
  hosts: bigdata_master
  become: true
  tasks:
    - name: Esperar 10 segundos a que los Workers se registren
      ansible.builtin.pause:
        seconds: 10

    - name: Comprobar DataNodes registrados en HDFS
      ansible.builtin.command:
        cmd: docker exec hadoop-namenode hdfs dfsadmin -report
      register: hdfs_report
      changed_when: false

    - name: Mostrar reporte de HDFS
      ansible.builtin.debug:
        var: hdfs_report.stdout_lines

    - name: Mensaje de éxito del despliegue
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - " CLÚSTER BIG DATA DESPLEGADO EXITOSAMENTE"
          - " - Spark Master WebUI:     http://192.168.56.10:8080"
          - " - Spark Master RPC:       spark://192.168.56.10:7077"
          - " - HDFS NameNode WebUI:    http://192.168.56.10:9870"
          - " - HDFS NameNode RPC:      hdfs://192.168.56.10:9000"
          - " - Spark Worker 1 WebUI:   http://192.168.56.11:8081"
          - " - Spark Worker 2 WebUI:   http://192.168.56.12:8081"
          - "=========================================================="
