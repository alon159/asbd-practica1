services:
  namenode:
    image: apache/hadoop:3.5.0
    container_name: hadoop-namenode
    hostname: master
    restart: unless-stopped
    user: "1001:100"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_HEAPSIZE_MAX: "256"
      HADOOP_HEAPSIZE_MIN: "128"
    entrypoint: ["hdfs"]
    command: ["namenode"]
    ports:
      - "9000:9000"
      - "9870:9870"
    volumes:
      - /opt/bigdata/hdfs/namenode:/data/hdfs/namenode
      - ./master/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./master/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
